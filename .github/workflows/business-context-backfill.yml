name: Business Context Backfill (daily until done)

# WO-SUB-08 병목 해소 — 슬롯 ② 전량 배치.
#
# 왜 필요한가 (2026-08-04 실측): 카드 3슬롯 커버리지에서 **슬롯 ② 가 유니버스 332장 중
# 9장(2.7%)** 이었고, 없는 323장 중 **307장이 `no_record`** 였다. 사업 실체 배치가 25종목만
# 돈 상태다. 레이아웃 문제가 아니라 배치 미실행이다.
#
# 왜 매일인가: Groq 무료 티어의 **일일 토큰 한도(TPD 100,000)** 가 벽이다. 종목당 실측
# ~1,486토큰(run 30824453514)이라 하루 약 67종목이 상한이고, 332종목은 **5일**이 걸린다.
# 유료 전환은 불가(Developer tier 중단). 같은 날 더 쪼개도 합계 한도가 같으므로 날짜를 나눈다.
#
# 커서는 서버(`bizctx-cursor`)에 있어서 매일 이어서 처리한다 — `reset` 을 주지 않는다.
# 08 을 막지 않는다: 이 배치가 도는 동안 08 은 ①③ 기본 레이아웃으로 진행한다.
on:
  schedule:
    # KST 04:00 — 프로덕션 크론(일 1회)과 겹치지 않는 시간대.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "1회 청크 종목 수(크론 함수 maxDuration=300 안에 들어와야 한다)"
        type: string
        default: "8"
      rounds:
        description: "최대 반복 횟수. 쿼터가 먼저 소진되면 그 전에 멈춘다"
        type: string
        default: "12"

permissions:
  contents: read

concurrency:
  group: business-context-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Synthesize until done or quota exhausted
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '8' }}
          ROUNDS: ${{ github.event.inputs.rounds || '12' }}
        run: |
          set -uo pipefail
          BASE="https://fomo-club-backend.vercel.app"
          AUTH=()
          if [ -n "${CRON_SECRET:-}" ]; then AUTH=(-H "Authorization: Bearer ${CRON_SECRET}"); fi

          fails=0
          processed_total=0
          for i in $(seq 1 "$ROUNDS"); do
            echo "== round $i =="
            # 라운드 실패로 전체를 포기하지 않는다 — 커서가 서버에 있어 다음 라운드가 이어받는다.
            if ! resp=$(curl -fsS --max-time 290 "${AUTH[@]}" "$BASE/api/fomo/cron/business-context?limit=${LIMIT}"); then
              fails=$((fails + 1))
              echo "round $i failed (연속 $fails)"
              if [ "$fails" -ge 3 ]; then echo "연속 3회 실패 — 중단"; break; fi
              sleep 20
              continue
            fi
            fails=0
            summary=$(node -e '
              const r = JSON.parse(process.argv[1]);
              const outcomes = r.outcomes ?? [];
              // 쿼터 소진을 시간 부족과 구분한다 — 대응이 정반대다(전자는 날짜를 나눠야 한다).
              const quota = outcomes.some((o) => /429|quota|per day|TPD/i.test(String(o.error ?? o.reason ?? "")));
              console.log(JSON.stringify({
                processed: r.processed ?? 0,
                remaining: r.remaining ?? null,
                done: Boolean(r.done),
                quota,
                badges: outcomes.reduce((acc, o) => { const k = o.badge ?? "?"; acc[k] = (acc[k] ?? 0) + 1; return acc; }, {}),
              }));
            ' "$resp") || { echo "응답 파싱 실패"; break; }
            echo "  $summary"
            processed_total=$((processed_total + $(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).processed))' "$summary")))

            if node -e 'process.exit(JSON.parse(process.argv[1]).done ? 0 : 1)' "$summary"; then
              echo "== all done =="
              break
            fi
            if node -e 'process.exit(JSON.parse(process.argv[1]).quota ? 0 : 1)' "$summary"; then
              echo "== 일일 쿼터 소진 — 오늘은 여기까지. 내일 크론이 커서를 이어받는다 =="
              break
            fi
            sleep 5
          done
          echo "오늘 처리: ${processed_total}종목"
          echo "오늘 처리: ${processed_total}종목" >> "$GITHUB_STEP_SUMMARY"

      - name: Slot coverage after today's chunk
        if: always()
        run: |
          set -uo pipefail
          # 진척도를 매일 남긴다 — 08 §4-1 이 이 비율을 배치 진척도로 쓴다.
          curl -fsS --max-time 120 -H "Cache-Control: no-cache" \
            "https://fomo-club-backend.vercel.app/api/fomo/business-context/coverage?cb=${GITHUB_RUN_ID}" > /tmp/bc.json || exit 0
          node -e '
            const r = require("/tmp/bc.json");
            const lines = [`## 사업 실체 커버리지 (${r.date ?? "-"})`, "", `- 유니버스 ${r.universe} / 레코드 **${r.records}**`, ""];
            for (const [market, b] of Object.entries(r.byMarket ?? {})) {
              lines.push(`- ${market}: n=${b.n} · 슬롯1 ${b.slot1} · 슬롯2 ${b.slot2} · 슬롯3 ${b.slot3}`);
            }
            lines.push("", `배지: ${JSON.stringify(r.badges ?? {})}`);
            const out = lines.join("\n");
            console.log(out);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
