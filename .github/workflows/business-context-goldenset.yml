name: Business Context Goldenset (manual)

# WO-SUB-03.5 PART C-1 재실행 — **10종목 × 3배치**.
#
# 왜 배치인가 (2026-08-01):
#   30종목 일괄 실행이 90분 타임아웃에 걸려 취소됐다(run 30678060170). 원인은 TPM 12,000 에서
#   429 를 받을 때마다 호출 간격이 곱셈으로 늘어나(1.6×, 상한 30s) 감속이 **한 러너 안에 누적**된
#   것이다. 유료 전환 대신 배치로 쪼갠다 — 배치마다 러너·타임아웃이 따로라 감속이 이월되지 않는다.
#
#   이어붙이기가 성립하는 이유는 증분 저장이다. 각 배치가 JSONL 을 누적해서 남기고 다음 배치가
#   `--carry` 로 이어받으므로, **마지막 배치의 아티팩트가 곧 30종목 전체 결과**다.
#
# 결과 해석 규칙은 그대로다:
#   이 실행은 `입력 N자 조건 하 결과`일 뿐 **AC#1 충족 판정에 쓰지 않는다**. AC#1 은 PART C-1
#   (입력 크기 A/B)로 크기를 확정한 뒤 그 크기에서 재실행한 결과로만 판정한다.
on:
  workflow_dispatch:
    inputs:
      input_chars:
        description: "SECTION_PROMPT_CHARS 오버라이드(미지정=코드 기본 3,500). A/B 는 이 값만 바꿔 재실행한다"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: business-context-goldenset
  cancel-in-progress: false

env:
  BATCHES: "3"

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund

      # 검증기 신뢰도를 골든셋보다 먼저 본다(§10) — 1배치에서 한 번만.
      - name: Verifier reliability check
        continue-on-error: true
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: npx tsx scripts/business-context-verifier-check.ts || echo "(검증기 점검 실패 — 골든셋은 계속하되 결과 해석 시 감안)"

      - name: Goldenset 1/3 (1~10번)
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          SEC_USER_AGENT: "FOMO Club research contact@fomoclub.app"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SECTION_PROMPT_CHARS_OVERRIDE: ${{ github.event.inputs.input_chars }}
        # **스텝 타임아웃이다.** 잡 타임아웃으로 죽으면 잡 자체가 cancelled 가 되어
        # 뒤의 `if: always()` 업로드까지 건너뛴다 — 실측(run 30693644434)에서 batch1·2 가
        # 45분에 걸려 취소됐고 아티팩트가 하나도 안 올라왔다. 증분 저장을 해놨는데도
        # 파일이 러너와 함께 사라진 것이다. 스텝 타임아웃은 스텝만 실패시키므로 업로드가 산다.
        timeout-minutes: 70
        continue-on-error: true
        run: npx tsx scripts/business-context-goldenset.ts --slice 1/3 --out docs/business-context

      # 타임아웃으로 죽어도 여기까지의 행은 올라간다 — 다음 배치가 이어받을 수 있다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldenset-batch1
          path: docs/business-context/golden30_progress.jsonl
          if-no-files-found: warn

  batch2:
    needs: batch1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: goldenset-batch1
          path: carry

      - name: Goldenset 2/3 (11~20번)
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          SEC_USER_AGENT: "FOMO Club research contact@fomoclub.app"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SECTION_PROMPT_CHARS_OVERRIDE: ${{ github.event.inputs.input_chars }}
        # **스텝 타임아웃이다.** 잡 타임아웃으로 죽으면 잡 자체가 cancelled 가 되어
        # 뒤의 `if: always()` 업로드까지 건너뛴다 — 실측(run 30693644434)에서 batch1·2 가
        # 45분에 걸려 취소됐고 아티팩트가 하나도 안 올라왔다. 증분 저장을 해놨는데도
        # 파일이 러너와 함께 사라진 것이다. 스텝 타임아웃은 스텝만 실패시키므로 업로드가 산다.
        timeout-minutes: 70
        continue-on-error: true
        run: npx tsx scripts/business-context-goldenset.ts --slice 2/3 --carry carry/golden30_progress.jsonl --out docs/business-context

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldenset-batch2
          path: docs/business-context/golden30_progress.jsonl
          if-no-files-found: warn

  batch3:
    needs: batch2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: goldenset-batch2
          path: carry

      - name: Goldenset 3/3 (21~30번)
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          SEC_USER_AGENT: "FOMO Club research contact@fomoclub.app"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SECTION_PROMPT_CHARS_OVERRIDE: ${{ github.event.inputs.input_chars }}
        # **스텝 타임아웃이다.** 잡 타임아웃으로 죽으면 잡 자체가 cancelled 가 되어
        # 뒤의 `if: always()` 업로드까지 건너뛴다 — 실측(run 30693644434)에서 batch1·2 가
        # 45분에 걸려 취소됐고 아티팩트가 하나도 안 올라왔다. 증분 저장을 해놨는데도
        # 파일이 러너와 함께 사라진 것이다. 스텝 타임아웃은 스텝만 실패시키므로 업로드가 산다.
        timeout-minutes: 70
        continue-on-error: true
        run: npx tsx scripts/business-context-goldenset.ts --slice 3/3 --carry carry/golden30_progress.jsonl --out docs/business-context

      - name: Summary (429·슬롯 채움·감속 이력을 눈으로)
        if: always()
        run: |
          test -f docs/business-context/golden30_raw.json || { echo "결과 없음"; exit 0; }
          node -e '
            const d = require("./docs/business-context/golden30_raw.json");
            const rows = d.rows || [];
            const slot = (k) => rows.filter((r) => r.context?.[k]).length;
            // status 를 가장 먼저 본다. 이 값이 없으면 저장소 커밋본(낡은 결과)을 읽고 있는 것이다 —
            // 실측(run 30678060170)에서 타임아웃 시 커밋본이 새 결과처럼 업로드된 적이 있다.
            if (!d.status) {
              console.log("⚠️ status 없음 — 이번 실행의 산출물이 아니다(저장소 커밋본일 가능성). 아래 수치를 결과로 쓰지 말 것.");
            } else if (d.status !== "complete") {
              console.log("🚧 미완주:", d.status, `(${d.completed}/${d.planned} 종목)`);
              console.log("   배치 하나가 죽었다는 뜻이다. 채움률을 성적으로 인용하지 않는다.");
            } else {
              console.log("✅ 완주:", d.completed + "/" + d.planned, "종목");
            }
            console.log("입력 크기:", d.inputChars, "자");
            console.log("슬롯1", slot("slot1_revenue_source") + "/" + rows.length,
                        "· 슬롯2", slot("slot2_dependency") + "/" + rows.length,
                        "· 슬롯3", slot("slot3_dependency_state") + "/" + rows.length);
            const badges = {};
            for (const r of rows) badges[r.context?.badge] = (badges[r.context?.badge] || 0) + 1;
            console.log("배지:", JSON.stringify(badges));
            const tally = {};
            for (const r of rows) for (const e of (r.context?.errors || [])) {
              const k = e.split(":")[0] + ": " + (e.split(":")[1] || "").trim().slice(0, 34);
              tally[k] = (tally[k] || 0) + 1;
            }
            console.log("== 실패 사유 ==");
            for (const [k, v] of Object.entries(tally).sort((a, b) => b[1] - a[1])) console.log(" ", v, "×", k);
            const four29 = Object.entries(tally).filter(([k]) => k.includes("429")).reduce((s, [, v]) => s + v, 0);
            console.log("429 건수:", four29, four29 === 0 ? "(페이싱 성공)" : "(감속 확인 필요)");
            console.log("== 페이싱(3배치 중 마지막 배치) ==");
            console.log(JSON.stringify(d.pacing, null, 2));
          '

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldenset-final-${{ github.run_id }}
          path: |
            docs/business-context/EVAL_golden30.md
            docs/business-context/golden30_raw.json
            docs/business-context/golden30_progress.jsonl
          if-no-files-found: warn
