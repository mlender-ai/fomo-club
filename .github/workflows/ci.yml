name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Auto Implement CEO Brief"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to check"
        required: false

env:
  NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000
  API_PASSWORD: ci-placeholder
  DASHBOARD_PASSWORD: ci-placeholder
  BOT_PASSWORD: ci-placeholder
  FRONTEND_ORIGIN: http://127.0.0.1:3100
  LOCAL_DEMO_MODE: true
  REPORT_PROVIDER: rule-based
  MARKET_DATA_PROVIDER: demo

jobs:
  resolve-ref:
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.value }}
    steps:
      - name: Determine checkout ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Auto Implement가 완료된 후 → 가장 최근 agent/ceo-brief 브랜치 찾기
            BRANCH=$(gh api repos/${{ github.repository }}/branches --jq '[.[] | select(.name | startswith("agent/ceo-brief-"))] | sort_by(.commit.commit.committer.date) | last | .name' 2>/dev/null || echo "")
            if [ -n "$BRANCH" ] && [ "$BRANCH" != "null" ]; then
              echo "value=$BRANCH" >> "$GITHUB_OUTPUT"
              echo "Found auto-implement branch: $BRANCH"
            else
              echo "value=" >> "$GITHUB_OUTPUT"
              echo "No agent/ceo-brief branch found, using default"
            fi
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

  repo-checks:
    needs: resolve-ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=dot

      # CTX-07 §4 — 성능 회귀 게이트. 오프라인·결정론(네트워크·DB 없음)이라 PR 마다 돌 수 있다.
      # 조회 라우트의 전이 임포트 그래프가 커지면 실패한다 — 504 사고의 원인이 그것이었다.
      - name: Perf regression gate
        run: npx tsx scripts/perf-regression-gate.ts

      # 불변식 문서가 정본(registry.json)의 생성물과 어긋나면 실패. 갈라지면 "게이트가 있다"는 착각이 남는다.
      - name: Invariants doc in sync
        run: npx tsx scripts/invariants-render.ts --check

      # ── 워크플로 파일 자체를 검사한다.
      #
      # ## 왜 (2026-08-23 실측)
      #
      # `vercel-production-deploy.yml` 을 고치다 `run:` 블록 **주석 안에** GitHub 식 구문을
      # 문자로 남겼다. GitHub 은 주석까지 식으로 파싱하므로 빈 식 하나가 **파일 전체를 무효로**
      # 만든다. 증상은 `This run likely failed because of a workflow file issue.` 뿐이고,
      # 주석 위치도 사유도 알려주지 않는다 — 로그도 annotation 도 비어 있었다.
      #
      # 더 나쁜 것은 **PR 체크가 초록이었다는 점**이다. YAML 파싱은 통과하고(문법은 정상이다)
      # 식 검사는 아무도 하지 않았다. 배포 워크플로가 깨진 채 머지될 수 있었다.
      #
      # `actionlint` 는 식 문법·컨텍스트 이름·액션 입력을 검사한다. shellcheck/pyflakes 는
      # 끈다 — 러너에 없으면 경고를 내고, 이 게이트가 잡아야 할 것은 식과 스키마다.
      - name: Workflow files lint (actionlint)
        run: |
          set -euo pipefail
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # 기존 지적(feedback-collect.yml)이 남아 있어 전수 실패로 막지 않는다 —
          # **이번에 만든 구멍(식 문법 오류)** 만 확실히 막는다. 대상을 넓히는 것은 별건이다.
          ./actionlint -shellcheck= -pyflakes= \
            .github/workflows/ci.yml \
            .github/workflows/vercel-production-deploy.yml \
            .github/workflows/rebake-on-git-deploy.yml

  build-api:
    runs-on: ubuntu-latest
    needs: [resolve-ref, repo-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build API workspace
        run: npm --workspace @fomo/legacy-paper-api run build

  build-web:
    runs-on: ubuntu-latest
    needs: [resolve-ref, repo-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build web workspace
        run: npm --workspace @fomo/backend run build

  build-fomo-web:
    runs-on: ubuntu-latest
    needs: [resolve-ref, repo-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build FOMO web workspace
        run: npm run build:fomo-web

  # ── Phase 3: CI 성공 시 auto-merge 트리거 ──────────────────────
  # workflow_run 이벤트는 2단계 전파 불가 → 명시적 dispatch
  dispatch-auto-merge:
    needs: [resolve-ref, repo-checks, build-api, build-web, build-fomo-web]
    if: |
      always() &&
      needs.repo-checks.result == 'success' &&
      needs.build-api.result == 'success' &&
      needs.build-web.result == 'success' &&
      needs.build-fomo-web.result == 'success' &&
      needs.resolve-ref.outputs.ref != '' &&
      (startsWith(needs.resolve-ref.outputs.ref, 'agent/ceo-brief-') ||
       startsWith(needs.resolve-ref.outputs.ref, 'agent/task-') ||
       startsWith(needs.resolve-ref.outputs.ref, 'agent/issue-'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.resolve-ref.outputs.ref }}
        run: |
          echo "CI 성공 — auto-merge dispatch: $BRANCH"
          gh workflow run auto-merge.yml \
            -f branch="$BRANCH" \
            --repo "${{ github.repository }}"
