name: Cron Probe

# LAB-FIX PART G — **대조 실험.** 임시다.
#
# `lab-collect` 의 `*/5` 크론이 main 에 올라간 뒤 1시간 50분 동안 **한 번도 안 돌았다.**
# 런이 실패한 게 아니라 **만들어지지도 않았다**(워크플로 런 총 1건, 그것도 수동 실행).
#
# 가를 것은 하나다:
#
#   이 워크플로가 돌면    → 문제는 `lab-collect.yml` 안에 있다
#   이것도 안 돌면        → 문제는 레포/계정 차원이다
#
# 그래서 여기에는 아무것도 없다. 크론과 echo 뿐이다 — 다른 게 있으면 그게 원인일 수 있다.
#
# **원인을 가른 뒤 지운다.**

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "발화 $(date -u +%Y-%m-%dT%H:%M:%SZ) · event=${{ github.event_name }}"
