name: Deck Stagnation Audit (manual)

# WO-DECK-01 PHASE 1 — 덱 고착 진단.
#
# "고치기 전에 실측한다." 랭킹 철학을 바꾸기 전에 무엇이 얼마나 고착됐는지 숫자로 남긴다.
# 저장된 레코드만 읽는다(SELECT 2개). 프로덕션 동작을 바꾸지 않고 외부 쿼터도 태우지 않는다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "관측 일수"
        required: false
        default: "14"

permissions:
  contents: read

concurrency:
  group: deck-stagnation
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Measure deck stagnation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          npx tsx scripts/audit/deck-stagnation.ts --days "${{ inputs.days || '14' }}" --out docs/audit 2>&1 | tee /tmp/deck.log
          cat docs/audit/DECK_STAGNATION.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deck-stagnation
          path: |
            docs/audit/DECK_STAGNATION.md
            docs/audit/deck_stagnation_raw.json
          if-no-files-found: warn
