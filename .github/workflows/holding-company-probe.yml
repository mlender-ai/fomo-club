name: Holding Company Probe (manual)

# WO-SUB-02R B1 — 지주회사 식별 축 실측.
#
# 왜 백엔드를 부르는가 (2026-08-03 실측):
#   `DART_API_KEY` 가 **GitHub 시크릿에 없다.** Vercel 환경변수에만 있어서 워크플로가
#   `secrets.DART_API_KEY` 를 참조해도 빈 값이 온다 — 첫 시도(run 30861831578)가 그래서
#   "DART_API_KEY 없음" 으로 죽었고, 같은 이유로 `business-context-goldenset` 세 배치와
#   `substance-audit` 도 그동안 DART 없이 돌고 있었다.
#   → 키가 실제로 있는 곳(Vercel 런타임)에서 돌린다. 팩트시트 백필과 같은 방식이다.
#
# 무엇을 답하는가: 전수 데이터로 **지주회사가 업종 축에서 식별되지 않는다**는 것이 이미
# 확인됐다(`복합기업` 18종목은 다각화 사업회사, 이름 패턴 92종목은 여러 업종에 분산).
# `induty_code` 가 지주군·비지주군을 분리하면 그것을 플래그로 쓴다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holding-company-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe via backend (DART key lives in Vercel env)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://fomo-club-backend.vercel.app"
          AUTH=()
          if [ -n "${CRON_SECRET:-}" ]; then AUTH=(-H "Authorization: Bearer ${CRON_SECRET}"); fi
          curl -fsS --max-time 290 "${AUTH[@]}" "$BASE/api/fomo/cron/holding-probe" > /tmp/probe.json
          node -e '
            const r = require("/tmp/probe.json");
            const lines = [];
            lines.push("# 지주회사 식별 축 프로브 (02R B1)");
            lines.push("");
            lines.push(`측정: ${r.generatedAt}`);
            lines.push("");
            lines.push("## 판정");
            lines.push("");
            const mark = { path2_ok: "✅", path2_partial: "⚠️", path2_unavailable: "❌" }[r.verdict] ?? "?";
            lines.push(`${mark} **${r.verdict}** — ${r.note}`);
            lines.push("");
            lines.push(`- 지주군 코드: ${r.holdingCodes.join(", ") || "(없음)"}`);
            lines.push(`- 비지주군 코드: ${r.nonHoldingCodes.join(", ") || "(없음)"}`);
            lines.push(`- 겹치는 코드: ${r.overlapCodes.join(", ") || "없음"}`);
            lines.push("");
            lines.push("## 응답 필드 (구조 실측 — 우리 코드가 처음 보는 엔드포인트다)");
            lines.push("");
            lines.push("```");
            lines.push(r.responseKeys.join(", ") || "(응답 없음)");
            lines.push("```");
            lines.push("");
            lines.push("## 표본별");
            lines.push("");
            lines.push("| 종목 | 사람 라벨 | induty_code | corp_cls | 비고 |");
            lines.push("|---|---|---|---|---|");
            for (const row of r.rows) {
              lines.push(`| ${row.name} | ${row.expected} | \`${row.induty_code ?? "—"}\` | ${row.corp_cls ?? "—"} | ${row.induty_note ?? ""} |`);
            }
            if ((r.errors ?? []).length) {
              lines.push("");
              lines.push("## 경고");
              lines.push("");
              for (const error of r.errors) lines.push(`- ${error}`);
            }
            const out = lines.join("\n");
            // stdout 과 Step Summary 양쪽에 남긴다 — Step Summary 는 API 로 못 읽는다.
            console.log(out);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holding-company-probe
          path: /tmp/probe.json
          if-no-files-found: warn
