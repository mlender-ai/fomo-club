name: Investor 13F Collect

# LAUNCH-P1 §C-3 — **13F 수집을 여기서 돈다.**
#
# SEC EDGAR 가 Vercel 런타임에서 막힌다(INFLUENCER-01 실측: 같은 코드가 로컬에서는 11인물
# 전부 받아온다). 실행 위치 문제라 수집만 옮기고, 결과는 인증된 창구로 POST 한다.
#
# 시각: 08:00 KST(23:00 UTC) — ARK 수집(23:20)보다 **먼저**다. 13F 쓰기는 ARK 칸을
# 건드리지 않지만, 픽 재생성 전에 둘 다 끝나 있어야 그날 덱에 인물 카드가 실린다.
#
# 13F 는 분기 공시라 매일 바뀔 것이 없다. 그래도 매일 도는 이유는 **제출이 언제 올라올지
# 모르기** 때문이다 — 하루 한 번 확인이 가장 단순한 방법이고 SEC 요청도 11건뿐이다.

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-13f-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect 13F and push to production
        env:
          # SEC 는 연락처 포함 UA 를 요구한다. 없으면 스크립트가 기본값으로 돌지만
          # 차단될 수 있으므로 시크릿을 넣어 두는 것이 맞다.
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          # 쓰기 창구 인증. **이 값이 없으면 스크립트가 POST 하지 않고 멈춘다.**
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INGEST_URL: https://fomo-club-backend.vercel.app/api/fomo/cron/investors/thirteenf
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET 이 없다 — 인증 없이 쓰기를 시도하지 않는다"
            exit 1
          fi
          npx tsx scripts/collect-thirteenf.ts 2>&1 | tee out.log
          code=${PIPESTATUS[0]}
          {
            echo "### 13F 수집"
            echo ""
            echo '```'
            tail -20 out.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
