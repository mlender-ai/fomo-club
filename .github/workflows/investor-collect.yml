name: Investor Collect

# WO-RESET-07 PART A — 유명 투자자 보유 내역을 **미리 모아둔다**.
#
# 라우트를 부르는 이유: SEC 가 연락처 포함 UA 를 요구하고 그 값이 Vercel 환경변수에 있다.
# 공시 수집과 같은 방식이다 — 키가 있는 런타임에서 돌리고 여기서는 호출만 한다.
#
# 시각: 08:20 KST(23:20 UTC). ARK 는 미국 장 마감 후 그날 보유를 올리므로 그 뒤여야 하고,
# 픽 재생성(quiet-pick)보다 **먼저** 돌아야 그날 덱에 인물 카드가 실린다.

on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call production investor collect endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          url="https://fomo-club-backend.vercel.app/api/fomo/cron/investors"
          auth=()
          if [ -n "${CRON_SECRET:-}" ]; then auth=(-H "authorization: Bearer ${CRON_SECRET}"); fi

          code=$(curl -s -o out.json -w '%{http_code}' --max-time 320 "${auth[@]}" "$url" || echo "000")
          echo "HTTP $code"
          cat out.json || true
          echo ""

          summary=$(node -e 'try{const j=require("./out.json");process.stdout.write(j.blocked?`blocked="${j.blocked}"`:`investors=${j.investors} errors=${j.errorCount}`)}catch(e){process.stdout.write("payload unreadable")}')
          {
            echo "### 유명 투자자 수집"
            echo ""
            echo "- HTTP: \`$code\`"
            echo "- $summary"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" != "200" ]; then
            echo "::error::인물 수집 실패 — 오늘 덱에 인물 카드가 안 실린다. out.json 을 보라."
            exit 1
          fi
