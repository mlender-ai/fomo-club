name: LAB 수집

# LAB-03 PART E — 수집 잡을 크론에 붙인다.
#
# **만들고 안 붙이는 게 이 프로젝트의 반복 실패다.**
#
# ## 왜 Vercel 크론이 아니라 Actions 인가
#
# 이 계정은 Vercel Hobby 다. Hobby 의 크론은 **하루 1회**만 돈다 —
# 1시간봉 갱신도 실시간 시세도 불가능하다. 그래서 Actions 로 돌린다.
#
# ## 페이퍼 실행 (LAB-07)
#
# 매시 **15분**에 돈다 — 봉 갱신(매시 5분)이 끝난 뒤다. 같은 분에 돌리면
# 방금 닫힌 봉이 아직 안 들어와 있어 한 시간씩 늦게 반영된다.
# 중복 실행은 `JobLock` 이 막는다(PART B-2).
#
# ## 1분 주기를 못 지킨다 (PART B-1)
#
# GitHub Actions 의 schedule 최소 간격은 **5분**이고, 실제로는 더 늦게 뜬다.
# 그래서 실시간 시세는 `*/5` 다. 진짜 1분 주기는 상주 워커가 필요하고,
# 그건 `LAB-07`(페이퍼 실행기)에서 `apps/api` 워커에 붙인다.
# `STALE_AFTER_MS` 를 3분으로 잡아둔 이유도 이것이다 — 5분 주기에서는
# 한 번만 늦어도 stale 로 잡히고, 그게 맞다.

on:
  schedule:
    - cron: "*/5 * * * *"   # 실시간 시세 (5분 — Actions 최소 간격)
    - cron: "5 * * * *"     # 봉 갱신 (매시 5분)
    # 펀딩비 — **여기서는 못 받는다.** fapi.binance.com 이 GitHub 러너(미국 IP)에
    # HTTP 451 을 준다. 연속 실패 13회까지 쌓이면서 `/data` 에 "펀딩비 ❌" 가
    # 떴는데, 정작 펀딩비는 로컬 러너가 받고 있었다 — 화면이 거짓말을 한 것이다.
    # 로컬에서는 같은 호출이 200 이다(docs/lab/CRON.md §0-3).
    # 파일을 지우지 않고 크론만 끈다. workflow_dispatch 로는 여전히 돌릴 수 있다.
    # - cron: "10 */8 * * *"  # 펀딩비 (8시간)
    - cron: "*/15 * * * *"  # 고래 (15분 — 지갑 30개 스캔에 ~8초)
    # 페이퍼 — **돌릴 전략이 없다.** `LAB-BRIDGE 0-3` 으로 랩 전략 3종을 폐기했고
    # `paper-tick` 은 status in (RUNNING, DRAFT) 만 고른다. 켜두면 매시 아무것도
    # 안 하고 `/data` 에 초록 줄만 쌓는다 — 일하는 것처럼 보이는 게 더 나쁘다.
    # 랩이 다시 전략을 돌리게 되면 이 줄의 `#` 만 떼면 된다.
    # - cron: "15 * * * *"    # 페이퍼 실행 (매시 15분 — 봉 갱신 10분 뒤)
  workflow_dispatch:
    inputs:
      job:
        description: "돌릴 잡"
        required: true
        type: choice
        options: [latest, candles, funding, whale, benchmark, backfill, paper, discard]

concurrency:
  group: lab-collect-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LAB_ALERT_WEBHOOK: ${{ secrets.LAB_ALERT_WEBHOOK }}
    steps:
      - name: 어느 잡인가
        id: pick
        run: |
          set -euo pipefail
          case "${{ github.event.schedule }}" in
            "*/5 * * * *")   echo "job=latest"  >> "$GITHUB_OUTPUT" ;;
            "5 * * * *")     echo "job=candles" >> "$GITHUB_OUTPUT" ;;
            "10 */8 * * *")  echo "job=funding" >> "$GITHUB_OUTPUT" ;;
            "*/15 * * * *")  echo "job=whale"   >> "$GITHUB_OUTPUT" ;;
            "15 * * * *")    echo "job=paper"   >> "$GITHUB_OUTPUT" ;;
            *)               echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: DATABASE_URL 확인
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL 시크릿이 없다. 수집이 돌 수 없다."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate

      - name: 수집 — ${{ steps.pick.outputs.job }}
        run: |
          set -euo pipefail
          case "${{ steps.pick.outputs.job }}" in
            latest)    npm run lab:latest ;;
            candles)   npm run lab:candles ;;
            funding)   npm run lab:funding ;;
            whale)     npm run lab:whale ;;
            paper)     npm run lab:paper ;;
            # LAB-BRIDGE 0-3 — 랩 전략 폐기. 상태만 바꾸고 결과는 안 지운다.
            # 수집이 아니라 일회성 관리 작업이라 크론에 없다. 손으로만 돈다.
            discard)   npm run lab:discard -- --confirm ;;
            benchmark) npm run lab:benchmark -- --symbol BTC --days 1200 ;;
            backfill)  npm run lab:candles -- --backfill && npm run lab:funding -- --backfill ;;
            *) echo "::error::모르는 잡: ${{ steps.pick.outputs.job }}"; exit 1 ;;
          esac
