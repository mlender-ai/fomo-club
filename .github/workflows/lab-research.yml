# UI-08 PART D — 연구 노트는 파일이 정본이다. main 에 올라가면 DB 와 화면이 따라온다.
#
#   docs/lab/research/*.md  →  npm run lab:research-seed  →  Research 표
#                           →  npm run lab:snapshot        →  연구 탭 조립본
#
# 시드는 규칙을 어긴 노트(명사형 제목 · 결정 없이 닫음 · 출처 없는 "알아낸 것")에서 멈춘다 —
# 그러면 이 잡이 빨갛게 떨어지고 DB 는 그대로다. 파서: apps/web/lib/lab/research-note.ts
name: lab-research

on:
  push:
    branches: [main]
    paths:
      - "docs/lab/research/**"
      - "apps/web/lib/lab/research-note.ts"
      - "scripts/lab/research-seed.ts"
  workflow_dispatch: {}

concurrency:
  group: lab-research
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: DATABASE_URL 확인
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL 시크릿이 없다."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate

      - name: 노트 → DB
        run: npm run lab:research-seed

      # 조립본이 옛 연구 목록을 들고 있으면 다음 FCE 업로드(15분)까지 화면이 안 바뀐다.
      - name: 조립본 다시 만들기
        run: npm run lab:snapshot
