name: Macro Collect

# WO-RESET-09 §A-3 — 거시 지표를 **숫자로** 모은다. 기사에는 라이선스가 붙지만
# 공공 통계 숫자에는 안 붙는다(FRED = 공개 도메인, 키 없이 CSV).
#
# 시각: 07:40 KST(22:40 UTC). 업종 분류표(08:00)·인물(08:20)·공시(08:40)보다 먼저.
#
# MACRO-01 §B-2 — 갱신 주기는 **매일**이다. 환율·지수·금리·원자재 전부 장 마감 뒤 하루 한 번.
# 국내 소스(네이버)는 당일 종가를 그날 저녁에 주므로 이 시각이면 어제치가 확정돼 있다.

on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call production macro collect endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          url="https://fomo-club-backend.vercel.app/api/fomo/cron/macro"
          auth=()
          if [ -n "${CRON_SECRET:-}" ]; then auth=(-H "authorization: Bearer ${CRON_SECRET}"); fi

          code=$(curl -s -o out.json -w '%{http_code}' --max-time 320 "${auth[@]}" "$url" || echo "000")
          echo "HTTP $code"
          cat out.json || true
          echo ""

          summary=$(node -e 'try{const j=require("./out.json");process.stdout.write(j.blocked?`blocked="${j.blocked}"`:`indicators=${j.indicators} moves=${(j.moves||[]).length} stale=${(j.staleIndicators||[]).length} errors=${j.errorCount}`)}catch(e){process.stdout.write("payload unreadable")}')
          # MACRO-01 §B-4 — 라우트가 며칠 연속 실패인지 세서 돌려준다. 워크플로는 기억이 없다.
          streak=$(node -e 'try{const j=require("./out.json");process.stdout.write(String(j.failStreak??0))}catch(e){process.stdout.write("0")}')
          alert=$(node -e 'try{const j=require("./out.json");process.stdout.write(j.alert?"1":"0")}catch(e){process.stdout.write("0")}')
          stale=$(node -e 'try{const j=require("./out.json");process.stdout.write((j.staleIndicators||[]).join(", "))}catch(e){process.stdout.write("")}')

          {
            echo "### 거시 지표 수집"
            echo ""
            echo "- HTTP: \`$code\`"
            echo "- $summary"
            if [ -n "$stale" ]; then
              echo "- 묵은 지표(카드 안 만듦): \`$stale\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" != "200" ]; then
            # **2일 연속이면 더 크게 운다**(§B-4). 하루 실패는 소스가 잠깐 죽은 것일 수 있지만
            # 이틀 연속이면 우리 파서나 소스 규약이 바뀐 것이다 — 사람이 봐야 한다.
            if [ "$alert" = "1" ]; then
              echo "::error::거시 지표 수집이 ${streak}일 연속 실패했다 — 소스 규약이 바뀌었거나 파서가 깨졌다. 사람이 확인해야 한다."
              echo "> ⚠️ **${streak}일 연속 실패** — 소스 규약이 바뀌었거나 파서가 깨졌다." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::거시 지표 수집 실패 — 오늘 덱에 거시 카드가 안 실린다. out.json 을 보라."
            fi
            exit 1
          fi
