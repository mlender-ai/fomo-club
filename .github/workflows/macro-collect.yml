name: Macro Collect

# WO-RESET-09 §A-3 — 거시 지표를 **숫자로** 모은다. 기사에는 라이선스가 붙지만
# 공공 통계 숫자에는 안 붙는다(FRED = 공개 도메인, 키 없이 CSV).
#
# 시각: 07:40 KST(22:40 UTC). 업종 분류표(08:00)·인물(08:20)·공시(08:40)보다 먼저.

on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call production macro collect endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          url="https://fomo-club-backend.vercel.app/api/fomo/cron/macro"
          auth=()
          if [ -n "${CRON_SECRET:-}" ]; then auth=(-H "authorization: Bearer ${CRON_SECRET}"); fi

          code=$(curl -s -o out.json -w '%{http_code}' --max-time 320 "${auth[@]}" "$url" || echo "000")
          echo "HTTP $code"
          cat out.json || true
          echo ""

          summary=$(node -e 'try{const j=require("./out.json");process.stdout.write(j.blocked?`blocked="${j.blocked}"`:`indicators=${j.indicators} moves=${(j.moves||[]).length} errors=${j.errorCount}`)}catch(e){process.stdout.write("payload unreadable")}')
          {
            echo "### 거시 지표 수집"
            echo ""
            echo "- HTTP: \`$code\`"
            echo "- $summary"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" != "200" ]; then
            echo "::error::거시 지표 수집 실패 — 오늘 덱에 거시 카드가 안 실린다. out.json 을 보라."
            exit 1
          fi
