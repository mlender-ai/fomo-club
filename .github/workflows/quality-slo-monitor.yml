name: Quality SLO Monitor

on:
  schedule:
    - cron: "35 21 * * *" # 06:35 KST, committee editor and quality cron 이후
  workflow_dispatch:

permissions:
  contents: read
  # CTX-07 §4 — SLO 초과 시 이슈를 자동 생성한다. `::warning` 은 아무도 보지 않는다.
  issues: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Expose latest committee run report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://fomo-club-backend.vercel.app/api/fomo/committee-report?limit=3"
          if [ -n "${CRON_SECRET:-}" ]; then
            curl -fsS "$URL" -H "Authorization: Bearer ${CRON_SECRET}" > /tmp/committee-report.json
          else
            curl -fsS "$URL" > /tmp/committee-report.json
          fi
          node - <<'NODE'
          const fs = require("fs");
          const result = JSON.parse(fs.readFileSync("/tmp/committee-report.json", "utf8"));
          const run = result.runs?.[0];
          if (!result.ok || !run) {
            console.log("::warning title=Committee report::No committee run report is available");
            process.exit(0);
          }
          const line = `${run.date} ${run.status} stage=${run.stage ?? "unknown"} step=${run.failureStep ?? "-"} calls=${run.callCount} candidates=${run.candidateCount} selected=${run.selectedCount}${run.error ? ` error=${run.error}` : ""}`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Committee run\n\n${line}\n`);
          console.log(line);
          if (run.status === "failed") console.log(`::warning title=Committee failed::${line}`);
          NODE

      - name: Materialize and read latest quality row
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://fomo-club-backend.vercel.app/api/fomo/cron/quality-slo"
          if [ -n "${CRON_SECRET:-}" ]; then
            curl -fsS "$URL" -H "Authorization: Bearer ${CRON_SECRET}" > /tmp/quality-slo.json
          else
            curl -fsS "$URL" > /tmp/quality-slo.json
          fi

      - name: Enforce fixed SLO targets
        id: slo
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const result = JSON.parse(fs.readFileSync("/tmp/quality-slo.json", "utf8"));
          const latest = result.latest;
          if (!result.ok || !latest) {
            console.log("::error title=Quality SLO ledger::Latest quality row is unavailable");
            process.exit(1);
          }
          const failures = Array.isArray(latest.failures) ? latest.failures : [];
          const summary = `${latest.date}: ${latest.passed ? "PASS" : `FAIL (${failures.join(", ")})`}`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Quality SLO\n\n${summary}\n`);
          // 미달 사유를 다음 스텝이 읽을 수 있게 남긴다. GITHUB_OUTPUT 은 **한 줄** 이어야 한다.
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${latest.passed ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary=${summary.replace(/\r?\n/g, " ")}\n`);
          if (!latest.passed) {
            console.log(`::warning title=Quality SLO missed::${summary}`);
            process.exit(0); // 이슈 생성 스텝까지 가야 한다 — 여기서 죽으면 알림이 안 뜬다
          }
          console.log(summary);
          NODE

      # CTX-07 §4 — 프로덕션 감시: SLO 초과 시 이슈 자동 생성.
      #
      # 같은 날 같은 이슈를 또 만들지 않는다(제목에 날짜를 넣고 검색). 알림이 매일 쌓이면
      # 알림이 아니라 배경 소음이 되고, 배경 소음은 아무도 읽지 않는다.
      - name: Open issue on SLO miss
        if: steps.slo.outputs.passed == 'false'
        uses: actions/github-script@v7
        env:
          SLO_SUMMARY: ${{ steps.slo.outputs.summary }}
        with:
          script: |
            const summary = process.env.SLO_SUMMARY || "(요약 없음)";
            const date = summary.split(":")[0].trim();
            const title = `[SLO] 품질 SLO 미달 — ${date}`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            if (existing.data.total_count > 0) {
              core.info(`이미 열린 이슈가 있다 — #${existing.data.items[0].number}`);
              return;
            }
            const body = [
              "품질 SLO 가 고정 목표에 미달했습니다.",
              "",
              "```",
              summary,
              "```",
              "",
              `- 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "- 대시보드: `/admin/quality`",
              "- 목표 정본: `apps/web/lib/quality-slo-ledger.ts#QUALITY_SLO_TARGETS`",
              "",
              "> CTX-07 §4 자동 생성. 목표를 낮춰서 닫지 말 것 — 왜 미달인지 먼저 본다.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["slo", "monitor"],
            });
