name: Quiet Pick Trigger

# 조용한 돈 픽(WO-G1A): 크론을 트리거해 발행 → GET 결과를 스텝 요약에 덤프.
#
# ## 굽기 스케줄은 여기가 아니라 `daily-bake.yml` 이다 (HOTFIX-DECK §B-5 · STATUS §24)
#
# 2026-08-28 에 화면이 「16시간 전 기준」이었다. 굽기가 Vercel 크론(`25 21 * * *`) 하나에만
# 걸려 있었는데 이 계정은 **Hobby** 플랜이고 그 파일엔 크론이 10개다 — 실측으로 선언 시각에
# 맞은 날이 10일 중 3일뿐이었다(STATUS §25-D). 그래서 이 워크플로에 스케줄을 붙였었다.
#
# 그 사이 `daily-bake.yml`(#1194)이 **수집 크론 뒤(09:10 KST)** 도는 전용 굽기로 들어왔다.
# 굽기 스케줄이 둘이면 20분 간격으로 같은 날짜 키를 두 번 덮어쓰고, 다음 사람이 어느 쪽이
# 정본인지 못 가린다. **전용 워크플로가 이긴다** — 여기서는 스케줄을 뺀다.
# 이 파일은 다시 **손으로 재는 경로**다(단계별 통과 수 덤프 + 짧은 덱 판정).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger quiet-pick cron and fetch result
        id: trigger
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://fomo-club-backend.vercel.app"
          AUTH=()
          if [ -n "${CRON_SECRET:-}" ]; then AUTH=(-H "Authorization: Bearer ${CRON_SECRET}"); fi

          echo "== triggering cron /api/fomo/cron/quiet-pick =="
          curl -fsS --max-time 290 "${AUTH[@]}" "$BASE/api/fomo/cron/quiet-pick" > /tmp/cron.json || { echo "cron call failed"; cat /tmp/cron.json || true; exit 1; }
          cat /tmp/cron.json

          echo "== fetching GET /api/fomo/quiet-picks =="
          # 크론이 방금 revalidateTag 했지만 CDN 반영 여유를 두고 캐시 우회.
          curl -fsS --max-time 60 "$BASE/api/fomo/quiet-picks?cb=$RANDOM" > /tmp/picks.json || { echo "get failed"; cat /tmp/picks.json || true; }

          node - <<'NODE'
          const fs = require("fs");
          const cron = JSON.parse(fs.readFileSync("/tmp/cron.json","utf8"));
          let picksResp = {};
          try { picksResp = JSON.parse(fs.readFileSync("/tmp/picks.json","utf8")); } catch {}
          const picks = picksResp.picks ?? [];
          const q = cron.qualification ?? picksResp.qualification ?? {};
          const out = [];
          out.push(`# 조용한 돈 픽 — 프로덕션 실측 (${cron.date ?? picksResp.date ?? "?"})`);
          out.push("");
          out.push(`- 발행 픽: **${picks.length}장** (cron published=${cron.published ?? "?"}, ledgerAppended=${cron.ledgerAppended ?? "?"}, ${cron.ms ?? "?"}ms)`);
          out.push(`- 자격 로그: KR유니버스 ${q.krUniverse ?? "?"} · KR신호 ${q.krWithSignal ?? "?"} · US내부자원천 ${q.usInsiderRaw ?? "?"} · US신호 ${q.usWithSignal ?? "?"} · 조용함통과 ${q.afterQuiet ?? "?"} · 품질통과 ${q.afterQuality ?? "?"}`);
          out.push(`- 탈락 사유: ${JSON.stringify(q.drops ?? {})}`);
          out.push("");
          // ── 단계별 통과 수(HOTFIX-DECK §A-1·§C-3) — 급감한 칸이 곧 원인이다.
          const f = q.funnel ?? null;
          if (f) {
            out.push("## 단계별 통과 수");
            out.push("| 단계 | 남은 수 |");
            out.push("|---|---|");
            out.push(`| 1 유니버스 (KR / US원천) | ${f.universeKr} / ${f.universeUs} |`);
            out.push(`| 2 일봉 확보 | ${f.withCandles} |`);
            out.push(`| 3 신호 검출 통과 | ${f.withSignal} (KR ${f.withSignalKr} · US ${f.withSignalUs} · 역행 ${f.divergence} · 각성 ${f.awakening}) |`);
            out.push(`| 4 기존 필터 통과 | ${f.qualified} |`);
            out.push(`| 5 재노출 규칙 통과 | ${f.freeOfRecentExposure} (보류 ${f.heldByRecentExposure}) |`);
            out.push(`| 6 덱 구성 통과 | ${f.deck} (안전장치 복귀 ${f.readmittedByFloor}) |`);
            out.push(`| 푼 규칙 | ${(f.relaxations ?? []).join(", ") || "없음"} |`);
            out.push("");
          } else {
            out.push("## 단계별 통과 수 — `funnel` 없음(HOTFIX-DECK 배포 전 페이로드)");
            out.push("");
          }
          // 회전율(WO-DECK-01 PHASE 5) — 1페이지가 어제와 겹치면 여기서 바로 보인다.
          const rot = cron.rotation ?? picksResp.rotation ?? null;
          if (rot) {
            out.push(`## 회전율 (${rot.compositionVersion ?? "?"})`);
            out.push(`- 1페이지: ${(rot.page1 ?? []).join(", ") || "(없음)"}`);
            const held = rot.page1HeldOver ?? [];
            out.push(`- 어제까지도 1페이지였던 종목: ${held.length ? held.map(h=>`${h.canonical}(${h.consecutiveDays}일)`).join(", ") : "**없음 — 매일 바뀌고 있다**"}`);
            out.push(`- 신규/지속 ${rot.freshCount ?? "?"}/${rot.persistentCount ?? "?"} · 경과일 중앙 ${rot.ageDaysMedian ?? "?"}일 · 쿨다운 적용 ${rot.cooldownApplied ?? 0} · 상한 초과 ${rot.agedOut ?? 0} · 재등장 ${rot.reentryCount ?? 0} · 줄인 장수 ${rot.shrunkBy ?? 0}`);
            out.push(`- 구성 하한/상한: 신규 ≥${rot.caps?.minFresh ?? "?"} · 동일유형 ≤${rot.caps?.maxSameKind ?? "?"} · 지속 ≤${rot.caps?.maxPersistent ?? "?"} (덱 ${rot.deckSize ?? "?"}장)`);
            out.push(`- 구성 규칙에 밀린 후보: ${JSON.stringify(rot.compositionSkipped ?? {})}`);
            // 고착 알림 — 1페이지 최상위가 3일 이상 버티면 감쇠·쿨다운이 안 먹은 것이다.
            const top = held.find(h => h.canonical === (rot.page1 ?? [])[0]);
            // consecutiveDays 는 **어제까지**의 연속일이므로 오늘을 더해 판정한다(3일째 = 2 + 오늘).
            if (top && top.consecutiveDays + 1 >= 3) {
              out.push("");
              out.push(`> 🚨 **고착 알림 — ${top.canonical} 이(가) ${top.consecutiveDays + 1}일째 1위다.** 목표는 3일 이하다. \`/admin/deck-rotation\` 확인.`);
              process.exitCode = 0; // 알림이지 실패는 아니다 — 발행 자체는 성공했다
              console.error(`[deck-rotation] STAGNATION top1=${top.canonical} days=${top.consecutiveDays + 1}`);
            }
            out.push("");
          } else {
            out.push("## 회전율 — `rotation` 없음(WO-DECK-01 배포 전 페이로드)");
            out.push("");
          }
          const dist = {};
          for (const p of picks) dist[p.signal?.kind] = (dist[p.signal?.kind]??0)+1;
          out.push(`## 신호 유형 분포`);
          out.push(Object.keys(dist).length ? Object.entries(dist).map(([k,v])=>`- ${k}: ${v}`).join("\n") : "- (없음)");
          out.push("");
          out.push(`## 픽 상세`);
          out.push("| # | 종목 | 시장 | 신호 | 주체·규모·일수 | 경과일 | 순위점수 | 재등장 사유 | 당일% | 현재가 | 훅 |");
          out.push("|---|---|---|---|---|---|---|---|---|---|---|");
          picks.forEach((p,i)=>{
            const s=p.signal??{}; const pr=p.price??{};
            const rank = typeof s.rankScore === "number" ? s.rankScore.toFixed(1) : "?";
            out.push(`| ${i+1} | ${p.subject?.canonical??"?"} | ${p.subject?.market??"?"} | ${s.kind??"?"} | ${s.actors??"?"} ${s.scale??""} (${s.days??"?"}일) | ${s.ageDays??"?"} | ${rank} | ${s.reentry?.text ?? "—"} | ${pr.changePct??"?"} | ${pr.currentText??pr.current??"?"} | ${p.hook??"?"} |`);
          });
          out.push("");
          out.push("<details><summary>raw JSON</summary>\n\n```json\n"+JSON.stringify({cron, picks},null,2).slice(0,12000)+"\n```\n</details>");
          const md = out.join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md+"\n");
          console.log(md);
          // 짧은 덱 판정을 다음 스텝이 읽을 수 있게 남긴다(§C-2).
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deck_size=${picks.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `relaxations=${(q.funnel?.relaxations ?? []).join(",")}\n`);
          NODE

      # ── 덱 5장 미만이면 알린다 (HOTFIX-DECK §C-2) ──
      #
      # 2026-08-28 에 덱이 1장인 것을 **사용자가 화면을 보고** 알았다. 런타임에도 웹훅 알림을
      # 걸었지만(`SLACK_WEBHOOK_URL`), 그 환경변수는 Vercel 쪽 설정이라 여기서 확인할 수 없다.
      # 이 스텝은 **레포 변수만으로** 도는 두 번째 경로다 — 한쪽이 꺼져 있어도 알림은 간다.
      - name: Alert on a short deck
        if: always() && steps.trigger.outputs.deck_size != ''
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          DECK_SIZE: ${{ steps.trigger.outputs.deck_size }}
          RELAXATIONS: ${{ steps.trigger.outputs.relaxations }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # 기준은 `DECK_ALERT_MIN`(apps/web/lib/deck-ranking.ts) 과 같은 5장이다.
          if [ "${DECK_SIZE}" -ge 5 ]; then
            echo "deck=${DECK_SIZE} — 기준(5장) 이상. 알림 없음."
            exit 0
          fi
          MSG="🚨 조용한 돈 덱이 ${DECK_SIZE}장입니다 (기준 5장). 푼 규칙: ${RELAXATIONS:-없음}. ${RUN_URL}"
          echo "$MSG"
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            jq -n --arg text "$MSG" '{"text": $text}' \
              | curl -sf -X POST "$(printf '%s' "$SLACK_WEBHOOK_URL" | tr -d '[:space:]')" \
                  -H "Content-Type: application/json" -d @- >/dev/null \
              && echo "슬랙 전송 완료" || echo "슬랙 전송 실패 — 아래 실패로 알린다"
          else
            echo "SLACK_WEBHOOK_URL 미설정 — 워크플로 실패로만 알린다"
          fi
          # 알림 채널이 없거나 죽어도 **런이 빨갛게 남는다.** 조용히 지나가는 경로를 만들지 않는다.
          exit 1
