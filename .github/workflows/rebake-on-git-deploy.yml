name: Rebake payload on Git auto-deploy

# ─────────────────────────────────────────────────────────────────────────────
# WO-RENDER-01 PART C 잔여 — **평상시 경로에 페이로드 재생성을 붙인다.**
#
# ## 무엇이 열려 있었나
#
# `vercel-production-deploy.yml` 의 `rebake-payload` 잡은 `on: workflow_dispatch:` 아래에만 있다.
# 그런데 Vercel Git 연동 자동배포가 살아 있어(`source: "git"`) `main` push 마다 배포가 나간다.
# → **재생성은 사람이 워크플로를 수동 실행한 배포에만 붙었고, 평상시 머지 경로에는 안 붙었다.**
# 결과: 머지해도 화면은 최대 24시간(다음 크론까지) 옛 페이로드다. 2026-08-17 실측에서
# `asOf 15:07 < 배포 16:09` 로 그 상태가 실제로 관측됐다.
#
# ## 왜 이 방식인가 (세 후보 비교)
#
# | 후보 | 판정 |
# |---|---|
# | Vercel **Deploy Hook** | ✗ 방향이 반대다. Deploy Hook 은 *Vercel 에 배포를 시키는* URL 이고, 우리가 필요한 것은 *배포가 끝난 뒤* 무언가를 하는 것이다 |
# | Vercel **Deployment 웹훅 → `repository_dispatch`** | ✗ 설정이 Vercel 대시보드에만 살고 레포에 안 남는다. GitHub PAT 을 Vercel 에 보관해야 한다. 리뷰·재현 불가 |
# | GitHub Actions **`push: [main]`** | ✓ 전부 레포 안. 리뷰·재현 가능. 실행 이력이 Actions 에 남아 관측된다 |
#
# ## `push` 트리거의 함정과 그 처리
#
# `push` 는 Vercel 빌드가 **끝나기 전에** 발동한다. 그 시점에 재생성을 부르면 **옛 코드가 페이로드를
# 굽는다.** 그러면 `asOf` 는 새로워지지만 산출물은 옛 로직 것이다 — `verify-production.ts` 는 통과하고
# 화면은 틀린, **가장 나쁜 종류의 위장된 통과**다.
#
# 그래서 재생성 전에 **정규 도메인이 이 커밋을 서빙하는지 확인**한다:
# `/api/fomo/ops/version` 의 `commit` 이 `github.sha` 와 같아질 때까지 폴링한다. 이것이
# 그 라우트(WO-RENDER-01 PART B)를 만든 이유 중 하나다 — 배포 기록이 아니라 **별칭이 지금 주는 것**을
# 재야 한다(#1076 이 그 차이에서 났다).
#
# 재생성이 실패해도 배포를 되돌리지 않되 **이 워크플로를 실패로 표시**해 조용히 넘어가지 않게 한다.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to wait for (default: current main HEAD)"
        required: false
        default: ""

# 같은 커밋에 두 번 굽지 않는다. 앞선 실행은 취소하지 않는다 —
# 재생성 도중 취소는 반쯤 쓴 페이로드를 남길 수 있다.
concurrency:
  group: rebake-on-git-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_BASE: https://fomo-club-backend.vercel.app
  WEB_BASE: https://fomo-web-mlender-ais-projects.vercel.app
  # 워크플로의 alias 대상이 정본이다(`vercel-production-deploy.yml`).
  WEB_PROJECT_ID: prj_dfwSKviFgdUg7MocHAqiBEPmaxcV
  VERCEL_TEAM_ID: team_wfSGvSkBTXHZXDsG26LtLT1B

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 프론트 정규 별칭을 이 커밋으로 옮긴다.
  #
  # ## 왜 이 잡이 필요한가 (2026-08-17 실측)
  #
  # 백엔드 정규 도메인 `fomo-club-backend.vercel.app` 은 **프로젝트 도메인으로 등록돼 있어**
  # Git 자동배포가 별칭을 따라 옮긴다. 프론트 정규 도메인
  # `fomo-web-mlender-ais-projects.vercel.app` 은 **그냥 별칭**이다 — `vercel-production-deploy.yml`
  # 의 `alias set` 스텝이 붙여준 것뿐이다. 그래서 **Git 자동배포는 프론트 별칭을 옮기지 않는다.**
  #
  # 실측: 머지 직후 프론트 최신 프로덕션 배포는 READY 이면서 **별칭이 0개**였고, 정규 도메인은
  # 1시간 반 전 빌드를 서빙했다(buildId `bd2mmusvXRD45Bco6elhc` vs 최신 `hTFMwPFrh0rn8vZBGJTwG`).
  # **#1076 과 같은 사고가 구조적으로 재발하고 있었다** — 프론트 코드 머지는 사람이 워크플로를
  # 수동 실행하지 않으면 화면에 닿지 않는다.
  #
  # ## 이 잡의 처리
  #
  # "가장 최신 배포" 를 붙이지 않는다 — 그건 다른 브랜치·재배포일 수 있다. **이 커밋의 SHA 와
  # 일치하는 READY 프로덕션 배포**를 찾아서 붙인다. 못 찾으면 실패로 끝낸다(엉뚱한 빌드 금지).
  #
  # ## 더 튼튼한 처방 (사람 필요)
  #
  # 이 잡은 별칭을 매번 다시 붙이는 **보정**이다. 근본 처방은 Vercel 에서
  # `fomo-web-mlender-ais-projects.vercel.app` 을 `fomo-web` 프로젝트의 **프로덕션 도메인으로 등록**해
  # 백엔드와 같은 취급을 받게 하는 것이다. 그건 레포가 아니라 Vercel 설정이라 사람이 해야 한다.
  # 등재: `docs/STATUS.md`.
  # ───────────────────────────────────────────────────────────────────────────
  align-web-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      outcome: ${{ steps.align.outputs.outcome }}
      deployment: ${{ steps.align.outputs.deployment }}
    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ inputs.sha }}"
          if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Point the canonical web domain at this commit
        id: align
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          target="${{ steps.target.outputs.sha }}"
          domain="${WEB_BASE#https://}"

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN 이 없어 프론트 별칭을 옮길 수 없다. 프론트 머지는 화면에 닿지 않는다."
            echo "outcome=no-token" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 이 커밋의 READY 프로덕션 배포를 찾는다. 빌드가 끝날 때까지 최대 15분 기다린다.
          deadline=$(( $(date +%s) + 900 ))
          url=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            list="$(curl -s --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$WEB_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=production&limit=20" || true)"
            url="$(printf '%s' "$list" | TARGET="$target" node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{
                  const j=JSON.parse(s);
                  const hit=(j.deployments||[]).find(d=>
                    (d.meta?.githubCommitSha||d.meta?.gitCommitSha)===process.env.TARGET &&
                    (d.state||d.readyState)==="READY");
                  process.stdout.write(hit?.url??"");
                }catch{process.stdout.write("")}
              })' 2>/dev/null || true)"
            if [ -n "$url" ]; then break; fi
            echo "이 커밋($target)의 READY 프론트 프로덕션 배포를 아직 못 찾았다 — 30초 후 재시도"
            sleep 30
          done

          if [ -z "$url" ]; then
            echo "::error::15분 안에 커밋 $target 의 READY 프론트 프로덕션 배포를 찾지 못했다. 별칭을 옮기지 않는다(엉뚱한 빌드를 붙이지 않는다)."
            echo "outcome=not-found" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "대상 배포: https://$url"
          echo "deployment=https://$url" >> "$GITHUB_OUTPUT"
          npx --yes vercel@latest alias set "$url" "$domain" --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_ID"

          # 붙였다고 끝이 아니다 — 정규 도메인에 물어 확인한다.
          ok="no"
          for _ in 1 2 3 4 5 6; do
            served="$(curl -s -H 'Cache-Control: no-cache' --max-time 30 \
              "$WEB_BASE/api/ops/version?cb=$(date +%s)-$RANDOM" | node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  try{process.stdout.write(String(JSON.parse(s).commit??""))}catch{process.stdout.write("")}
                })' 2>/dev/null || true)"
            echo "프론트 정규 도메인 서빙 커밋: ${served:-(읽지 못함)}"
            if [ "$served" = "$target" ]; then ok="yes"; break; fi
            sleep 20
          done

          if [ "$ok" != "yes" ]; then
            # 이 워크플로를 도입한 커밋 이전 빌드에는 버전 라우트가 없어 확인이 불가능할 수 있다.
            echo "::warning::별칭은 설정했지만 정규 도메인에서 커밋을 확인하지 못했다(버전 라우트 미배포 가능). verify 단계가 다시 판정한다."
            echo "outcome=aliased-unconfirmed" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=served" >> "$GITHUB_OUTPUT"
          fi

  rebake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `verify-production.ts` 가 배포 커밋과 HEAD 의 **계보**를 본다(뒤처짐 vs 분기).
          # shallow clone 이면 그 판정이 전부 `미확인` 이 된다 — 게이트가 무력해진다.
          fetch-depth: 0

      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ inputs.sha }}"
          if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "대기 대상 커밋: $sha"

      # ── 문서만 바뀐 push 면 재생성을 건너뛴다.
      #
      # 2026-08-23 빈 덱 사고의 방아쇠는 **문서 커밋 하나였다**(`docs/STATUS.md` §12). 문서
      # 배포의 재생성은 페이로드에 만들 차이가 0 인데 위험(커넥션 풀 고갈 시각과의 충돌)만 있다.
      #
      # 트리거의 `paths-ignore` 로 막지 않는다 — 그러면 `align-web-alias` 까지 안 돌고, 프론트
      # 정규 도메인이 직전 배포에 남아 `verify-production.ts` 가 `뒤처짐` → fail 로 판정한다.
      # 별칭은 모든 push 에서 옮겨야 하고, 건너뛸 것은 재생성뿐이다.
      #
      # 판정 불가(force-push·첫 push·수동 실행)는 **재생성한다** — 모를 때는 굽는 쪽이 안전하다.
      - name: Decide whether this push changes anything the payload depends on
        id: scope
        shell: bash
        run: |
          set -uo pipefail
          before="$(printf '%s' "${{ github.event.before }}" | tr -cd '0-9a-f')"
          target="${{ steps.target.outputs.sha }}"

          decide() {
            echo "needed=$1" >> "$GITHUB_OUTPUT"
            echo "판정: $1 — $2"
            echo "- 재생성 판정: \`$1\` — $2" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${{ github.event_name }}" != "push" ]; then
            decide true "수동 실행 — 명시적 요청이므로 굽는다"; exit 0
          fi
          if [ -z "$before" ] || [ "$before" = "$(printf '0%.0s' $(seq 40))" ]; then
            decide true "직전 커밋을 알 수 없다(첫 push 등) — 변경 범위를 판정할 수 없으므로 굽는다"; exit 0
          fi
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            decide true "직전 커밋 $before 이 이 클론에 없다(force-push 등) — 판정 불가이므로 굽는다"; exit 0
          fi

          changed="$(git diff --name-only "$before" "$target" || true)"
          echo "변경 파일:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # 문서로 보는 것: docs/ 아래 전부 + 마크다운. 그 밖(워크플로·스크립트·prisma 포함)은
          # 모두 코드로 본다 — 재생성 결과를 바꿀 수 있다.
          code="$(printf '%s\n' "$changed" | grep -vE '^docs/|\.md$' || true)"
          if [ -z "$code" ]; then
            decide false "문서만 바뀐 push(docs/ · *.md) — 재생성이 만들 차이가 없다"
          else
            decide true "문서 아닌 변경 $(printf '%s\n' "$code" | grep -c . )건"
          fi

      # ── 배포가 정규 도메인에 닿을 때까지 기다린다.
      #
      # 종료 조건 셋:
      #   served   — 버전 라우트의 commit == 대상 커밋. 정상 경로.
      #   no-route — 버전 라우트가 계속 404. 이 워크플로를 도입한 커밋 자체가 그렇다(라우트가
      #              아직 프로덕션에 없다). 유예 후 진행하되 요약에 표시한다.
      #   timeout  — 시간 초과. 실패로 끝낸다(재생성하지 않는다 — 옛 코드로 구울 위험).
      - name: Wait for the canonical domain to serve this commit
        id: wait
        if: ${{ steps.scope.outputs.needed == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          target="${{ steps.target.outputs.sha }}"
          deadline=$(( $(date +%s) + 900 ))   # 15분. 실측 배포 소요는 1~2분이고 여유를 크게 둔다.
          notfound=0
          outcome="timeout"
          served_commit=""

          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl -s -H 'Cache-Control: no-cache' --max-time 30 \
              "$API_BASE/api/fomo/ops/version?cb=$(date +%s)-$RANDOM" || true)"
            code="$(printf '%s' "$body" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{const j=JSON.parse(s);process.stdout.write(String(j.commit??""))}catch{process.stdout.write("")}
              })' 2>/dev/null || true)"

            if [ -n "$code" ]; then
              notfound=0
              served_commit="$code"
              echo "정규 도메인 서빙 커밋: $code"
              if [ "$code" = "$target" ]; then outcome="served"; break; fi
            else
              notfound=$(( notfound + 1 ))
              echo "버전 라우트를 읽지 못했다 (연속 $notfound 회)"
              # 8회(=약 4분) 연속 실패면 라우트가 아직 배포되지 않은 것으로 본다.
              # 그때는 배포 여유를 주고 진행한다 — 첫 도입 커밋에서 영구히 막히지 않게.
              if [ "$notfound" -ge 8 ]; then outcome="no-route"; break; fi
            fi
            sleep 30
          done

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "served_commit=$served_commit" >> "$GITHUB_OUTPUT"

          if [ "$outcome" = "timeout" ]; then
            echo "::error::15분 안에 정규 도메인이 $target 을 서빙하지 않았다. 옛 코드로 페이로드를 구울 위험이 있어 재생성하지 않는다."
            exit 1
          fi
          if [ "$outcome" = "no-route" ]; then
            echo "::warning::버전 라우트가 없다(미배포 커밋). 배포 여유 5분을 두고 진행한다 — 이 실행의 재생성은 새 코드 기준임을 보장하지 못한다."
            sleep 300
          fi

      # 재시도한다 — 사고 당시 실패는 일시적이었다(프리웜 워크플로와 겹쳐 커넥션 풀 pool_size 15
      # 가 마름). 라우트가 **쓰기 전에** 판정하므로 실패한 시도는 페이로드를 건드리지 않는다.
      # 자세한 근거는 `vercel-production-deploy.yml` 의 같은 스텝에 있다.
      - name: Rebake quiet-pick payload (retry on transient DB exhaustion)
        id: rebake
        if: ${{ steps.scope.outputs.needed == 'true' }}
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          auth=()
          if [ -n "${CRON_SECRET:-}" ]; then auth=(-H "authorization: Bearer ${CRON_SECRET}"); fi

          backoff=(0 45 90 150)
          code="000"
          for attempt in 0 1 2 3; do
            wait="${backoff[$attempt]}"
            if [ "$wait" -gt 0 ]; then
              echo "── ${wait}초 대기 후 재시도 $((attempt + 1))/4"
              sleep "$wait"
            fi
            code=$(curl -s -o rebake.json -w '%{http_code}' --max-time 320 "${auth[@]}" \
              "$API_BASE/api/fomo/cron/quiet-pick" || echo "000")
            echo "시도 $((attempt + 1))/4 → HTTP $code"
            cat rebake.json || true
            echo ""

            ok=$(node -e 'try{const j=require("./rebake.json");process.stdout.write(String(j.ok===true))}catch(e){process.stdout.write("false")}' 2>/dev/null || echo false)
            if [ "$code" = "200" ] && [ "$ok" = "true" ]; then break; fi
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "인증 실패 — 재시도하지 않는다."
              break
            fi
            if [ "$code" = "503" ]; then
              echo "발행 가드가 차단했다 — 직전 페이로드는 유지된 상태다. DB 회복을 기다려 재시도한다."
            fi
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Report rebake
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ steps.scope.outputs.needed }}" != "true" ]; then
            {
              echo "### 페이로드 재생성 — 건너뜀"
              echo ""
              echo "문서만 바뀐 push 다. 페이로드는 직전 것을 그대로 쓴다(별칭은 옮겼다)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code="${{ steps.rebake.outputs.code }}"
          ok=$(node -e 'try{const j=require("./rebake.json");process.stdout.write(String(j.ok===true))}catch(e){process.stdout.write("false")}' 2>/dev/null || echo false)
          blocked=$(node -e 'try{const j=require("./rebake.json");process.stdout.write(String(j.blocked??""))}catch(e){process.stdout.write("")}' 2>/dev/null || echo "")
          summary=$(node -e 'try{const j=require("./rebake.json");process.stdout.write(j.blocked?`blocked="${j.blocked}" attemptedPicks=${j.attemptedPicks} keptPriorPicks=${j.keptPriorPicks} inputFailures=${JSON.stringify(j.qualification?.inputFailures??[])} date=${j.date}`:`published=${j.published} ledgerAppended=${j.ledgerAppended} stamped=${j.stamped} date=${j.date} ms=${j.ms}`)}catch(e){process.stdout.write("payload unreadable")}' 2>/dev/null || echo "payload unreadable")
          {
            echo "### 페이로드 재생성"
            echo ""
            echo "- 대상 커밋: \`${{ steps.target.outputs.sha }}\`"
            echo "- 배포 대기 결과: \`${{ steps.wait.outputs.outcome }}\` (서빙 커밋 \`${{ steps.wait.outputs.served_commit }}\`)"
            echo "- 재생성 HTTP: \`$code\` · ok: \`$ok\`"
            echo "- $summary"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$blocked" ]; then
            echo "::error::발행 가드가 재생성을 차단했다 — $blocked. **화면은 비지 않았다**(직전 페이로드 유지). DB 커넥션 풀·수급 파이프라인을 확인하고 재실행하라."
            exit 1
          fi
          if [ "$code" != "200" ] || [ "$ok" != "true" ]; then
            echo "::error::페이로드 재생성 실패 — 배포는 유지되지만 화면은 옛 페이로드다. 수동 확인 필요."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 최종 판정 — 앞의 둘이 실패해도 **재본다**(`if: always()`). 무엇이 어긋났는지가 실패 사실보다
  # 유용하고, 부분 성공(백엔드는 됐고 프론트는 안 됐다)을 구분해야 한다.
  #
  # 검증 규칙을 여기 복사하지 않고 `verify-production.ts` 를 그대로 호출한다 —
  # 두 곳에 두면 갈라지고, 갈라지면 CI 초록과 로컬 실측이 다른 말을 한다.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    needs: [align-web-alias, rebake]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify with verify-production.ts
        id: verify
        shell: bash
        env:
          # 있으면 배포 시각을 **별칭 해소 기준**으로 정확히 얻는다. 없으면 스크립트가
          # 배포 커밋의 커밋 시각(하한)으로 대체한다 — 더 관대하지만 거짓 통과는 아니다.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          # `npm ci` 를 하지 않는다 — 이 스크립트는 node 빌트인만 쓰고 레포 모듈을 import 하지 않는다.
          set +e
          npx --yes tsx@4 scripts/verify-production.ts 2>&1 | tee verify.log
          echo "verify_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          verify_exit="${{ steps.verify.outputs.verify_exit }}"
          {
            echo "### 배포 → 화면 최종 판정"
            echo ""
            echo "- 프론트 별칭 정렬: \`${{ needs.align-web-alias.result }}\` (\`${{ needs.align-web-alias.outputs.outcome }}\`, 배포 \`${{ needs.align-web-alias.outputs.deployment }}\`)"
            echo "- 페이로드 재생성: \`${{ needs.rebake.result }}\`"
            echo "- verify-production exit: \`${verify_exit:-미실행}\`  (0=통과 · 1=실패 · 2=미확인 · 3=스크립트 오류)"
            echo ""
            if [ -f verify.log ]; then
              echo '```'
              cat verify.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 미확인(2)은 실패로 세지 않는다 — 버전 라우트 미배포 등 측정 제약이 섞인다.
          # 다만 초록으로도 세지 않는다: 이 워크플로가 성공해도 exit 2 였다면 요약을 읽어야 한다.
          if [ "${verify_exit:-3}" = "1" ]; then
            echo "::error::verify-production 실패 — 배포가 화면에 닿지 않았다. 요약의 판정 항목을 보라."
            exit 1
          fi
          if [ "${verify_exit:-3}" = "3" ]; then
            echo "::error::verify-production 자체가 실패했다(측정 불가). 스크립트를 고쳐야 한다."
            exit 1
          fi
