name: Sector Map

# WO-RESET-08 §E-3 — 국내 업종 분류표.
#
# 업종은 상장·폐지 때만 바뀌므로 하루 한 번이면 충분하다. 요청 83번 · 실측 32초.
# **커버리지가 흐름 카드의 성립 조건**이라 응답의 그 값을 요약에 남긴다.
#
# 시각: 08:00 KST(23:00 UTC). 인물 수집(08:20)·공시 수집(08:40)보다 먼저.

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sector-map
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call production sector map endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          url="https://fomo-club-backend.vercel.app/api/fomo/cron/sector-map"
          auth=()
          if [ -n "${CRON_SECRET:-}" ]; then auth=(-H "authorization: Bearer ${CRON_SECRET}"); fi

          code=$(curl -s -o out.json -w '%{http_code}' --max-time 320 "${auth[@]}" "$url" || echo "000")
          echo "HTTP $code"
          cat out.json || true
          echo ""

          summary=$(node -e 'try{const j=require("./out.json");process.stdout.write(j.blocked?`blocked="${j.blocked}"`:`groups=${j.groups} mapped=${j.mapped} coverage=${j.coveragePct}% errors=${j.errorCount}`)}catch(e){process.stdout.write("payload unreadable")}')
          {
            echo "### 업종 분류표"
            echo ""
            echo "- HTTP: \`$code\`"
            echo "- $summary"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" != "200" ]; then
            echo "::error::업종 분류 수집 실패 — 흐름 카드의 전제가 무너진다. out.json 을 보라."
            exit 1
          fi
