name: Symbol Risk Backfill

# WO-SUB-06.5 — 종목 고유 리스크 합성 배치.
#
# 프로덕션 크론 라우트를 `done: true` 까지 반복 호출한다(팩트시트 백필과 같은 패턴).
# 라우트가 SEC·DART·LLM 을 부르므로 그 자격증명을 가진 실행 환경(Vercel)에서 돌아야 한다 —
# 여기서 직접 스크립트를 돌리지 않고 라우트를 두들기는 이유다.
#
# **일일 스케줄 배선**(WO-SUB-FILL PART 2 — 비용 사용 승인됨). 수동 실행에만 의존한 결과
# 한 번도 돌지 않아 리스크 레코드가 1건이었다. AGENTS.md 블랙리스트는 *자율 기획* cron 을
# 막는 것이고, 이건 데이터 배치다(팩트시트·사업실체와 같은 부류).
#
# Vercel 크론이 아닌 이유: 함수 1회 호출은 청크 하나(6종목)만 돈다 → 400종목에 67일.
# 워크플로는 라운드를 이어 돌려 하루 TPD 한도까지 채운다.
#
# 스케줄 시각 **00:30 UTC**(= KST 09:30)인 이유는 두 가지다.
#
# 1. **일일 한도가 실제로 소진되고 있다(실측).** 이 WO 착수 시점에 라우트가
#    "일일 쿼터 소진 — 합성 미완" 을 돌려줬고, 사업실체 커버리지의 지배적 실패도
#    `ai: 합성 호출 실패` 139건이었다. 늦은 시각에 돌리면 그날 몫을 다른 호출이 태운 뒤라
#    남은 것만 줍는다.
#    **리셋 시각 자체는 측정하지 않았다** — Groq 의 일일 한도가 UTC 기준으로 리셋된다는
#    전제로 00:30 UTC 를 골랐다. 전제가 틀리면 실행 요약의 quota_exhausted 빈도로 드러나고,
#    그때 시각을 옮긴다(추측을 코드에 굳히지 않고 관측 가능하게 둔다).
# 2. 사업실체 백필(19:00 UTC)과 **18시간 떨어진다.** 두 배치가 같은 한도를 쓰는데 페이싱
#    상태는 프로세스 안에서만 공유된다 — 별개 실행 사이에는 공유되지 않으므로, 시간으로
#    떨어뜨리는 것이 유일한 분리 수단이다.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "1회 청크 종목 수(기본 6). 종목당 최대 4콜 × 페이싱"
        required: false
        default: "6"
      rounds:
        description: "최대 반복 라운드(기본 20). done 이면 조기 종료"
        required: false
        default: "20"
      only:
        description: "쉼표로 구분한 종목(canonical 또는 심볼). 비우면 전 유니버스"
        required: false
        default: ""
      reset:
        description: "커서 초기화 — 첫 라운드에만 붙는다"
        required: false
        type: boolean
        default: false
      force:
        description: "전량 재합성(재합성 불필요 판정 무시). 비용 발생"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: symbol-risk-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Backfill symbol risks
        env:
          BASE: https://fomo-club-backend.vercel.app
          LIMIT: ${{ inputs.limit }}
          ROUNDS: ${{ inputs.rounds }}
          ONLY: ${{ inputs.only }}
          RESET: ${{ inputs.reset }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # 스케줄 실행은 inputs 가 비어 있다 → 여기 기본값이 그날의 예산이 된다.
          #
          # TPD 실측 기준 종목당 1,486토큰 ≈ 하루 67종목. limit 6 × rounds 11 = 66종목.
          # 이미 합성된 종목은 LLM 을 부르지 않고 `skipped` 로 지나가므로, 라운드는 커서가
          # 유니버스를 훑는 속도이기도 하다 — 커서가 날짜별로 리셋되므로 라운드 수가 모자라면
          # 매일 앞쪽 종목만 다시 훑고 새 진척이 0 이 된다. 그래서 **유니버스를 다 훑을 만큼**
          # 크게 두고(70×6=420 ≥ 유니버스 441 에 근접), 실제 비용은 TPD 소진이 멈춰 세운다.
          rounds="${ROUNDS:-70}"
          limit="${LIMIT:-6}"
          STALL=0
          summary=/tmp/symbol-risk.md
          : > "$summary"
          for i in $(seq 1 "$rounds"); do
            url="$BASE/api/fomo/cron/symbol-risk?limit=$limit"
            # reset 은 첫 라운드에만 — 붙여두면 매 라운드가 커서를 지워 무한 반복이 된다.
            if [ "$i" = "1" ] && [ "$RESET" = "true" ]; then url="$url&reset=1"; fi
            if [ "$FORCE" = "true" ]; then url="$url&force=1"; fi
            if [ -n "$ONLY" ]; then url="$url&only=$(printf '%s' "$ONLY" | sed 's/ //g')"; fi
            echo "round $i: $url"
            body="$(curl -sS --max-time 320 "$url" || echo '{"ok":false,"error":"curl failed"}')"
            printf '%s\n' "$body" | head -c 2000
            echo
            processed="$(printf '%s' "$body" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("processed","?"))' 2>/dev/null || echo "?")"
            skipped="$(printf '%s' "$body" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("skipped","?"))' 2>/dev/null || echo "?")"
            remaining="$(printf '%s' "$body" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("remaining","?"))' 2>/dev/null || echo "?")"
            items="$(printf '%s' "$body" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(sum(o.get("items",0) for o in d.get("outcomes",[])))' 2>/dev/null || echo "?")"
            echo "| $i | $processed | $skipped | $items | $remaining |" >> "$summary"
            done_flag="$(printf '%s' "$body" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("done"))' 2>/dev/null || echo "None")"
            # LLM 한도 상태를 라운드마다 읽는다.
            #
            # **처음 구현은 "쿼터" 라는 낱말만 봤고 동작하지 않았다**(실측: 라운드 4개가 전부
            # 429 로 실패했는데 루프가 안 멈췄다). 저장되는 사유는 대부분
            # `합성 호출 실패(HTTP 429)` 다 — 일일 한도(errorBody 에 "per day")일 때만
            # "일일 쿼터 소진" 문구가 되고 분당 한도는 429 로 남는다. 낱말 감지는 새는 것이다.
            #
            # 그리고 **페이싱 상태는 라운드를 넘어 유지되지 않는다.** 라운드마다 새 서버리스
            # 호출이라 in-process 감속이 초기화된다 — 3초 간격으로 몰아치면 매 라운드가 429 를
            # 맞는다. 그래서 429 우세 라운드에는 간격을 크게 벌리고 연속 3회면 그친다.
            state="$(printf '%s' "$body" | python3 -c 'import json,sys;o=json.load(sys.stdin).get("outcomes",[]);t=[((x.get("unavailable_reason") or "")+" "+" ".join(x.get("errors",[]))) for x in o];s=sum(1 for x in o if x.get("items",0)>0);print("empty" if not o else "quota_exhausted" if any("일일 쿼터" in v for v in t) else "rate_limited" if s==0 and all(("429" in v or "쿼터" in v) for v in t) else "progress")' 2>/dev/null || echo unknown)"
            echo "state: $state"
            if [ "$state" = "quota_exhausted" ]; then echo "일일 한도 소진 — round $i 에서 그친다"; STATUS=quota_exhausted; break; fi
            if [ "$done_flag" = "True" ]; then echo "done at round $i"; STATUS=done; break; fi
            if [ "$state" = "rate_limited" ]; then
              STALL=$((STALL + 1))
              if [ "$STALL" -ge 3 ]; then echo "429 연속 3라운드 — round $i 에서 그친다"; STATUS=rate_limited; break; fi
              echo "429 우세 — 60초 대기 후 재개 (연속 $STALL 회)"
              sleep 60
              continue
            fi
            STALL=0
            sleep 3
          done
          STATUS="${STATUS:-partial}"
          {
            echo '### 종목 리스크 백필'
            echo ''
            echo "종료 상태: **$STATUS**"
            echo ''
            echo '`done` 완주 · `quota_exhausted` 일일 한도 · `rate_limited` 429 연속 3라운드 · `partial` 라운드 소진'

            echo ''
            echo '| 라운드 | 처리 | 건너뜀 | 확보 항목 | 남음 |'
            echo '|---|---|---|---|---|'
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
