name: US Market Prewarm

# Twelve Data free tier is tight, so split the US quote/sparkline prewarm into two
# alternating slots. Vercel native cron is not available on the current backend
# project plan; this workflow calls the production prewarm endpoint instead.

on:
  schedule:
    - cron: "0,10,20,30,40,50 * * * *"
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Prewarm slot to run (0 or 1). Defaults to current schedule slot."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: us-market-prewarm
  cancel-in-progress: false

jobs:
  prewarm:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve slot
        id: slot
        env:
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SLOT:-}" ]; then
            SLOT="$INPUT_SLOT"
          else
            MINUTE="$(date -u +%M)"
            if [ $((10#$MINUTE % 10)) -eq 0 ]; then
              SLOT="0"
            else
              SLOT="1"
            fi
          fi
          if [ "$SLOT" != "0" ] && [ "$SLOT" != "1" ]; then
            echo "invalid slot: $SLOT" >&2
            exit 1
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Call production prewarm endpoint
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://fomo-club-backend.vercel.app/api/fomo/cron/us-market-prewarm/${SLOT}"
          if [ -n "${CRON_SECRET:-}" ]; then
            curl -fsS "$URL" -H "Authorization: Bearer ${CRON_SECRET}"
          else
            curl -fsS "$URL"
          fi

      # 거래량 이력 부트스트랩 (US-02 B-2) — **별도 엔드포인트**.
      #
      # 이 작업을 위 프리웜 안에 넣었다가 `maxDuration` 60초를 넘겨 504 로 죽였다
      # (2026-09-01). 시세 캐시를 살려두는 일과 있으면 좋은 일을 같은 함수에 두면,
      # 있으면 좋은 일이 살아 있어야 하는 일을 죽인다. 그래서 스텝도 분리하고
      # **실패해도 워크플로를 죽이지 않는다**(`continue-on-error`) — 시세는 이미 채워졌다.
      - name: Bootstrap US volume history
        if: steps.slot.outputs.slot == '1'
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          URL="https://fomo-club-backend.vercel.app/api/fomo/cron/us-volume-bootstrap"
          if [ -n "${CRON_SECRET:-}" ]; then
            code="$(curl -sS -o /tmp/us-volume.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer ${CRON_SECRET}" "$URL" || echo "000")"
          else
            code="$(curl -sS -o /tmp/us-volume.json -w '%{http_code}' --max-time 70 "$URL" || echo "000")"
          fi
          echo "volume-bootstrap http=${code}"
          head -c 400 /tmp/us-volume.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::warning title=거래량 부트스트랩 실패::http=${code} — 시세 캐시는 무관하다. 다음 판이 재시도한다"
          fi

      # WO-OPS-504: 이 스텝이 07-27부터 18일간 `curl: (22) ... 504` 한 줄만 남기고 죽었다.
      # 그 한 줄로는 몇 초에 끊겼는지도, 무엇이 오래됐는지도 알 수 없었다. 이제
      # ① `--max-time` 으로 우리가 먼저 끊고 ② HTTP 코드·소요초를 남기고 ③ `meta.stale` 을 본다.
      # 스테일 200 은 실패가 아니지만 **성공도 아니다** — 경고로 남긴다.
      - name: Warm US discovery after both slots
        if: steps.slot.outputs.slot == '1'
        run: |
          set -uo pipefail
          URL="https://fomo-club-backend.vercel.app/api/fomo/discovery?country=US&debug=timings"
          started="$(date +%s)"
          # 라우트 마감 45초 + maxDuration 60 여유. 라우트보다 먼저 끊지 않는다.
          code="$(curl -sS -o /tmp/us-discovery.json -w '%{http_code}' --max-time 75 "$URL" || echo "000")"
          elapsed="$(( $(date +%s) - started ))"
          echo "discovery http=${code} elapsed=${elapsed}s"
          if [ "$code" != "200" ]; then
            echo "::error::US discovery 조회 실패 (http=${code}, ${elapsed}s) — docs/ops/INCIDENT_prewarm_20260814.md"
            head -c 400 /tmp/us-discovery.json || true
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const json = JSON.parse(fs.readFileSync("/tmp/us-discovery.json", "utf8"));
            const fronts = Object.values(json.fronts || {});
            const priced = fronts.filter((front) => front && front.priceText && front.priceText !== "$0.00").length;
            const spark = fronts.filter((front) => Array.isArray(front && front.sparkline) && front.sparkline.length >= 2).length;
            const meta = json.meta || {};
            console.log(JSON.stringify({ stocks: json.stocks?.length || 0, cards: json.cards?.length || 0, fronts: fronts.length, priced, spark }));
            if (meta.timings) console.log("timings " + JSON.stringify(meta.timings));
            if (meta.staleServe) {
              console.log(`::warning::스테일 응답 (savedAt=${meta.staleServe.savedAt}) — 빌드가 마감을 넘겼다. 초록이지만 빌드는 안 끝났다`);
            }
          '
